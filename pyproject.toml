[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "railwatcher"
version = "0.1.0"
description = "A Raspberry Pi lookout for the world's railways"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
export = ["ultralytics>=8.3,<9", "onnx>=1.17,<2"]

[project.scripts]
railwatcher = "railwatcher.__main__:main"

[tool.setuptools.package-data]
railwatcher = ["static/*", "static/vendor/*", "static/vendor/images/*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["railwatcher*"]
