<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>RailWatch · Trains.FYI</title><script>try{document.documentElement.dataset.theme=localStorage.getItem('railwatcher-theme')||'light'}catch{}</script><link rel="stylesheet" href="/static/vendor/leaflet.css"><link rel="stylesheet" href="/static/style.css"><script defer src="/static/vendor/leaflet.js"></script><script defer src="/static/app.js"></script></head>
<body>
<header>
  <a class="brand" href="/" aria-label="RailWatch by Trains.FYI home">
    <img class="brand-logo" src="/static/trainsfyi-logo.png" alt="">
    <span class="brand-name">RailWatch <small>by Trains.FYI</small></span>
  </a>
  <div class="header-right"><button id="software-update-notice" type="button" hidden>Please update</button><span class="device-state" id="system-status" role="status" data-state="starting"><span class="device-dot" aria-hidden="true"></span><span id="system-status-label">Connecting…</span></span></div>

</body></html>
