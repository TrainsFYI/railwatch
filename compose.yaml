services:
  railwatcher:
    build: .
    image: railwatcher:local
    init: true
    restart: unless-stopped
    user: "10001:10001"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --data
      - /data
      - --model
      - /models/train.onnx
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${RAILWATCHER_DATA_DIR:-./data}:/data
      - ${RAILWATCHER_MODEL_DIR:-./models}:/models:ro
    ports:
      - "${RAILWATCHER_BIND_IP:-127.0.0.1}:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/status', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
